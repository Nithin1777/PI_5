slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link          # we have NO base_footprint
    scan_topic: /scan
    mode: localization             # Ceres scan-match inside a serialized pose-graph
    use_sim_time: false

    # serialized map to localize within (room.posegraph + room.data from `map save`)
    map_file_name: /root/maps/room
    #map_start_pose: [0.0, 0.0, 0.0]   # reseed.py publishes /initialpose instead

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02     # publish map -> odom continuously (0 = never)
    map_update_interval: 5.0
    resolution: 0.05
    min_laser_range: 0.1               # quiet the min-range warning; LD19 minimum is ~0.1 m
    max_laser_range: 20.0              # for rastering images
    minimum_time_interval: 0.2     # was 0.5. Gates scan processing BY TIME; combined
                                   # with minimum_travel_distance below it decides how
                                   # often map->odom gets a fresh timestamp.
    transform_timeout: 1.0         # was 0.2. slam_toolbox stamps map->odom as
                                   # (last PROCESSED scan time + transform_timeout) and
                                   # then republishes that FROZEN stamp at 50 Hz, so the
                                   # transform ages at 1 s per second whenever no scan is
                                   # processed. Measured: raising 0.2 -> 3.0 shifted the
                                   # stamp ceiling by exactly +2.8 s. This is the validity
                                   # window each publish buys; 1.0 s comfortably covers the
                                   # gap between updates at the travel thresholds below.
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000        # larger stack needed to deserialize big maps

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    # THESE TWO WERE THE NAV KILLER. slam_toolbox processes a scan only after the
    # robot has moved this far; until then map->odom keeps its old timestamp. At 0.5 m
    # in a room whose largest navigable region is ~1.5 m2 (~1.2 m across), the rover
    # almost never travelled far enough, so map->odom went stale by a measured median
    # of 4.5 s (worst 12.2 s, 97% of publishes backdated past nav2's 0.5 s tolerance).
    # DWB then could not transform the robot pose into the global plan's frame ->
    # "Unable to transform robot pose into global plan's frame" x152 -> "Controller
    # patience exceeded" x15 -> follow_path aborted. That is the premature stop, and
    # the frozen-then-jumping pose is why the goal distance read 0.00 m then 1.82 m.
    # Mapping looked fine because driving by hand covers 0.5 m constantly.
    #
    # Lowered 0.1 -> 0.05 so map->odom is corrected roughly twice as often while the
    # rover is actually driving. The reason is measured: with 0.1, a short nav run
    # (~0.3 m with a couple of turns) ended with a heading error almost exactly equal
    # to the error reseed.py started it with -- 0.4 deg in -> 3.0 deg out, 8.9 deg in
    # -> 9.0 deg out. slam_loc was contributing no correction over the run, so the seed
    # error passed straight through to the final pose while Nav2 faithfully drove to
    # "believed yaw = 0".
    #
    # NOT lowered further, deliberately. On a PARKED rover map->odom was once measured
    # rotating 23 deg over three minutes while map->base_link moved 16 deg -- slam
    # matching against rf2o's drift and over-correcting. More frequent matching is not
    # automatically better in a small, feature-poor room; it also injects more of that.
    # 0.05 is a compromise, and return_home.py's verify-and-correct pass is the actual
    # safety net rather than this value.
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.05
    scan_buffer_size: 3
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    do_loop_closing: true
    loop_match_minimum_chain_size: 3
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    loop_search_maximum_distance: 3.0

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
